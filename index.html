<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Code Crime Scene</title>
<meta name="description" content="A comic-detective debugging game: 50 coding crime scenes in Python, Java and JavaScript, from Beginner to IMPOSSIBLE.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2210%22%20r%3D%226.5%22%20fill%3D%22%23ffd23f%22%20stroke%3D%22%2317161f%22%20stroke-width%3D%222.6%22%2F%3E%3Cpath%20d%3D%22M15%2015l6%206%22%20stroke%3D%22%2317161f%22%20stroke-width%3D%223.2%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: a comic book page. Ink-outlined panels with hard offset shadows on a halftone sheet;
   the crime scene is a code panel on the left and an evidence column (sticky notes, printout, duck) on the right. */
:root{
  --paper:#f4f8ff; --sheet:#ffffff; --ink:#17161f; --ink-soft:#5a5870;
  --yellow:#ffd23f; --yellow-deep:#f4b400; --red:#ff4b4b; --blue:#2f9bff; --sky:#a9dcff;
  --green:#21b36b; --mint:#c9f5dc; --pink:#ffb3d9; --blush:#ffe1e1; --dot:rgba(47,155,255,.17);
  --display:'Bangers','Impact','Arial Black',system-ui,sans-serif;
  --body:'Comic Neue','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
  --line:3px solid var(--ink); --shadow:6px 6px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background-color:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(var(--dot) 1.7px,transparent 1.8px);background-size:15px 15px;min-height:100%}
.wrap{max-width:1200px;margin:0 auto;padding-block:14px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.h-display{font-family:var(--display);font-weight:400;letter-spacing:.04em;line-height:1;margin:0;text-wrap:balance}
.panel{background:var(--sheet);border:var(--line);box-shadow:var(--shadow);border-radius:6px}
.small{font-size:14px;color:var(--ink-soft)}
.lbl{font-family:var(--display);letter-spacing:.08em;font-size:15px;color:var(--ink-soft)}
.ico{width:1.1em;height:1.1em;vertical-align:-.15em;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);letter-spacing:.06em;font-size:20px;line-height:1;
  border:var(--line);background:var(--yellow);box-shadow:4px 4px 0 var(--ink);padding:10px 16px;border-radius:6px;cursor:pointer;
  transition:transform .1s,box-shadow .1s,background .15s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--sheet)}
.btn.red{background:var(--sheet)}
.btn.red.on{background:var(--red);color:#fff}
.btn.big{font-size:26px;padding:14px 26px}
.btn.small{font-size:17px;padding:7px 12px}
.btn small{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:0;opacity:.75}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-family:var(--display);font-size:26px;letter-spacing:.05em;padding:4px 0}
.brand .ico{width:28px;height:28px;color:var(--ink)}
.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;align-items:center;border:var(--line);border-radius:6px;background:var(--sheet);box-shadow:3px 3px 0 var(--ink);overflow:hidden}
.seg-l{font-family:var(--display);letter-spacing:.06em;font-size:14px;padding:0 8px;color:var(--ink-soft)}
.seg button{border:0;border-left:2px solid var(--ink);background:none;padding:6px 10px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yellow)}
.snd{border:var(--line);border-radius:6px;background:var(--sheet);box-shadow:3px 3px 0 var(--ink);width:38px;height:36px;display:grid;place-items:center;cursor:pointer}
.snd .ico{width:20px;height:20px}

/* title screen */
.title-screen{display:grid;gap:22px}
.cover{position:relative;overflow:hidden;padding-block:34px 30px;padding-inline:clamp(16px,4vw,48px);text-align:center}
.rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,#ffe57a 0 9deg,#fff5c2 9deg 18deg);animation:spin 80s linear infinite}
.cover-in{position:relative;display:grid;justify-items:center;gap:14px}
.issue{font-family:var(--display);letter-spacing:.1em;background:var(--ink);color:var(--yellow);padding:4px 12px;border-radius:4px;transform:rotate(-2deg)}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(46px,11vw,118px);line-height:.88;margin:0;color:var(--yellow);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);transform:rotate(-3deg);letter-spacing:.03em;text-wrap:balance}
.logo.small{font-size:clamp(36px,7vw,72px)}
.cover-art{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,6vw,80px);margin-block:6px}
.cover-duck{width:clamp(130px,26vw,220px);animation:bob 2.6s ease-in-out infinite}
.cover-clock{position:relative;width:clamp(70px,13vw,110px);animation:wobble 1s steps(2) infinite;filter:drop-shadow(4px 4px 0 rgba(23,22,31,.25))}
.tk{position:absolute;font-family:var(--display);font-size:20px;letter-spacing:.06em;color:var(--red);-webkit-text-stroke:1px var(--ink)}
.tk.t1{top:-18px;left:-30px;animation:floaty 2s ease-in-out infinite}
.tk.t2{top:-30px;right:-34px;animation:floaty 2s ease-in-out 1s infinite}
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.caption{background:var(--yellow);padding:16px 18px;animation:rise .5s var(--d,0s) both}
.caption p{margin:0;font-weight:700;font-size:18px}
.caption:nth-child(2){transform:rotate(.8deg)}
.caption:nth-child(3){transform:rotate(-.6deg)}
.how{padding:20px clamp(16px,3vw,28px)}
.how h2{font-family:var(--display);font-weight:400;letter-spacing:.05em;font-size:30px;margin:0 0 12px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how li{counter-increment:s;position:relative;padding:12px 12px 12px 54px;border:2px dashed var(--ink-soft);border-radius:6px}
.how li::before{content:counter(s);position:absolute;left:10px;top:10px;width:34px;height:34px;border:var(--line);border-radius:50%;
  display:grid;place-items:center;font-family:var(--display);font-size:20px;background:var(--sky)}

/* board */
.board-screen{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:880px){.board-screen{grid-template-columns:minmax(0,1fr)}}
.files-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.files-head h2{font-size:42px}
.star-total{display:flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums}
.star-total .star{width:24px;height:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:18px}
.case-card{position:relative;display:grid;gap:6px;align-content:start;text-align:left;background:var(--sheet);border:var(--line);box-shadow:var(--shadow);
  border-radius:6px;padding:14px 14px 12px;cursor:pointer;min-height:150px;transition:transform .15s,box-shadow .15s;animation:rise .45s var(--d,0s) both;overflow:hidden}
.case-card:hover:not([disabled]){transform:translate(-3px,-3px) rotate(-.6deg);box-shadow:9px 9px 0 var(--ink)}
.case-card.final{background:linear-gradient(135deg,#fff 0 60%,var(--blush) 60%)}
.case-card.locked{background:repeating-linear-gradient(-45deg,#eef0f6 0 10px,#e3e6ef 10px 20px);cursor:not-allowed;box-shadow:3px 3px 0 var(--ink)}
.case-card.locked .case-title,.case-card.locked .case-who{opacity:.45}
.case-no{font-family:var(--display);letter-spacing:.08em;font-size:15px;background:var(--ink);color:var(--yellow);justify-self:start;padding:2px 8px;border-radius:3px}
.case-title{font-family:var(--display);font-size:25px;letter-spacing:.03em;line-height:1.02}
.case-who{font-size:14px;color:var(--ink-soft);font-weight:700}
.case-foot{margin-top:auto;display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px}
.case-foot .star{width:22px;height:22px}
.open-tag{color:var(--blue)}
.mini-stamp{position:absolute;right:-6px;top:22px;font-family:var(--display);letter-spacing:.08em;color:var(--red);border:3px solid var(--red);
  padding:1px 8px;transform:rotate(14deg);font-size:18px;background:rgba(255,255,255,.7)}
.poster{padding:16px;background:#fff8dc;display:grid;gap:10px;transform:rotate(1deg)}
.poster-title{font-family:var(--display);font-size:46px;letter-spacing:.12em;text-align:center;line-height:1}
.poster-art{position:relative;aspect-ratio:1/1;max-width:100%;border:var(--line);background:#fff;overflow:hidden;display:grid;place-items:center}
.poster-art .clock{width:78%}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.tile{background:var(--ink-soft);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:36px;color:var(--sheet)}
.tile:nth-child(odd){background:#6b6982}
.tile.gone{visibility:hidden}
.tile.reveal{animation:tileOff .9s .35s cubic-bezier(.5,0,.8,.4) forwards}
.poster-name{font-family:var(--display);font-size:26px;letter-spacing:.08em;text-align:center}
.poster.caught .poster-name{color:var(--red)}
.arrest{position:absolute;font-family:var(--display);font-size:44px;letter-spacing:.08em;color:var(--red);border:5px solid var(--red);padding:0 12px;
  background:rgba(255,255,255,.75);transform:rotate(-14deg);animation:stamp .5s .2s both}
.found{border-top:2px dashed var(--ink-soft);padding-top:8px}
.found-h{font-family:var(--display);letter-spacing:.06em;font-size:16px}
.found ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:4px}
.found li{font-family:var(--mono);font-size:13px;background:#fff;border:1.5px solid var(--ink);padding:3px 8px;transform:rotate(-.6deg)}
.found li:nth-child(even){transform:rotate(.7deg)}

/* overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(23,22,31,.55);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s both}
.overlay>.panel{width:100%;max-width:640px;max-height:100%;overflow:auto;padding:22px clamp(16px,3vw,28px);animation:panelIn .5s cubic-bezier(.3,1.5,.5,1) both}
.intro{display:grid;gap:16px}
.intro-head{display:grid;gap:8px;justify-items:start}
.intro-head h2{font-size:clamp(32px,6vw,46px)}
.witness{display:flex;gap:14px;align-items:flex-start}
.face{width:86px;height:86px;flex:none;border:var(--line);border-radius:8px;background:var(--sky)}
.w-name{font-weight:700;font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.bubble{position:relative;background:#fff;border:var(--line);border-radius:18px;padding:10px 14px;font-weight:700;min-height:2.6em}
.bubble.big{font-size:18px}
.bubble::before{content:"";position:absolute;left:-14px;top:16px;border:9px solid transparent;border-right:14px solid var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-9px;top:19px;border:6px solid transparent;border-right:10px solid #fff;border-left:0}
.evidence-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ev{border:var(--line);border-radius:6px;padding:8px 12px;display:grid;gap:2px;min-width:0}
.ev span{font-family:var(--display);letter-spacing:.08em;font-size:15px}
.ev code{font-family:var(--mono);font-weight:700;font-size:16px;overflow-wrap:anywhere}
.ev.ok{background:var(--mint)}
.ev.bad{background:var(--blush)}
.taunt{display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;border-radius:6px;padding:10px 14px}
.taunt .clock{width:54px;flex:none;animation:wobble 1s steps(2) infinite}
.taunt p{margin:0;font-family:var(--display);letter-spacing:.06em;font-size:20px;color:var(--yellow)}
.intro-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;align-items:center}

/* scene */
.scene{display:grid;gap:18px}
.scene-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.sh-title{display:grid;gap:6px;flex:1;min-width:200px}
.sh-title h2{font-size:clamp(30px,5vw,44px)}
.sh-right{display:flex;align-items:center;gap:14px}
.stars{display:flex;gap:2px}
.stars .star{width:30px;height:30px}
.star{fill:#e6e5ee;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round}
.star.on{fill:var(--yellow)}
.star.lost{animation:lost .6s forwards}
.deadline{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--yellow);border-radius:6px;padding:4px 12px 4px 6px;font-family:var(--mono);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.deadline .clock{width:38px;animation:wobble 1s steps(2) infinite}
.deadline.urgent{background:var(--red);color:#fff;animation:pulse .5s ease-in-out infinite alternate}
.scene-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:920px){.scene-grid{grid-template-columns:minmax(0,1fr)}}
.col-main,.col-side{display:grid;gap:18px;min-width:0}
.report{display:flex;gap:14px;padding:14px;align-items:flex-start}
.report .face{width:70px;height:70px}
.report-body{display:grid;gap:10px;min-width:0;flex:1}
.report-body p{margin:0;font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .sp{flex:1}
.code-panel{position:relative;overflow:hidden;transition:box-shadow .2s}
.code-panel[data-mode="accuse"]{box-shadow:6px 6px 0 var(--red)}
.code-panel.siren{animation:siren .35s linear 6}
.tape{height:30px;background:var(--yellow);border-bottom:var(--line);overflow:hidden;white-space:nowrap;font-family:var(--display);letter-spacing:.14em;
  font-size:18px;line-height:28px;transform-origin:left;animation:tapeIn .6s cubic-bezier(.2,.9,.3,1) both}
.tape span{display:inline-block;animation:tape 18s linear infinite;padding-left:8px}
.code-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 14px;border-bottom:2px dashed #d3d6e4;font-family:var(--mono);font-size:13px;flex-wrap:wrap}
.code-head .file{font-weight:700}
.mode-hint{font-family:var(--display);letter-spacing:.06em;font-size:16px;color:var(--red)}
.code-wrap{position:relative;overflow:auto;padding-block:12px 22px}
.lines{position:relative;min-width:max-content;font-family:var(--mono);font-size:15px;line-height:1.5}
.ln{position:relative;display:flex;width:100%;align-items:center;border:0;background:transparent;text-align:left;padding:4px 30px 4px 0;cursor:default;font-family:var(--mono);font-size:15px}
.ln::before{content:"";position:absolute;inset:2px 8px 2px 50px;background:var(--yellow);border-radius:3px;transform:scaleX(0);transform-origin:left;transition:transform .28s ease,background .2s}
.ln .no{position:relative;width:58px;flex:none;text-align:right;padding-right:16px;color:var(--ink-soft);font-size:12.5px}
.ln code{position:relative;white-space:pre;font-family:var(--mono);transition:transform .15s}
.ln.cur::before{transform:scaleX(1)}
.code-panel[data-mode="accuse"] .ln{cursor:pointer}
.code-panel[data-mode="accuse"] .ln:hover::before,.code-panel[data-mode="accuse"] .ln:focus-visible::before{transform:scaleX(1);background:var(--blush)}
.code-panel[data-mode="accuse"] .ln:hover code{transform:translateX(6px)}
@media (pointer:fine){.code-panel[data-mode="accuse"] .code-wrap,.code-panel[data-mode="accuse"] .ln{cursor:none}}
.ln.fixed::before{transform:scaleX(1);background:var(--mint)}
.ln.fixed::after{content:"✓";position:absolute;right:10px;font-weight:700;color:var(--green)}
.ln.just code{animation:rewrite .7s steps(24) both}
.ln.guilty::before{transform:scaleX(1);background:#ffc4c4}
.ln.warm{box-shadow:inset 0 0 0 2px transparent}
.ln.warm .no{color:var(--red);font-weight:700;animation:pulse .8s ease-in-out infinite alternate}
.ln.vanish{max-height:40px;overflow:hidden;animation:vanish .5s forwards}
.ln.vanish code{text-decoration:line-through 3px var(--red)}
.k{color:#5b3df5;font-weight:700}
.b{color:#0b7285}
.s{color:#d9480f}
.n{color:#c2255c}
.marker{position:absolute;left:4px;top:0;width:28px;height:28px;color:var(--ink);opacity:0;transition:transform .38s cubic-bezier(.45,1.6,.4,1),opacity .2s;z-index:3;pointer-events:none}
.marker.show{opacity:1}
.marker svg{width:100%;height:100%}
.marker .glassfill{fill:var(--sky)}
.cond{position:absolute;z-index:4;transform:translateY(-50%);background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:2px 10px;
  font-family:var(--mono);font-size:13px;font-weight:700;box-shadow:3px 3px 0 var(--ink);white-space:nowrap;animation:pop .3s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
.cond::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:9px solid var(--ink);border-left:0}
.cond.alibi{background:var(--blush);font-family:var(--body);font-size:15px}
.lens{position:absolute;width:170px;height:170px;z-index:6;pointer-events:none}
.lens .glass{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:5px solid var(--ink);background:var(--sheet);box-shadow:5px 5px 0 rgba(23,22,31,.3)}
.lens .glass::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #fff}
.lens::after{content:"";position:absolute;left:148px;top:136px;width:16px;height:62px;background:var(--ink);border-radius:6px;transform:rotate(-45deg);transform-origin:top center}
.lens-in{position:absolute;left:0;top:0;transform-origin:0 0}
.fixes{display:grid;gap:12px}
.fixes h3{font-size:28px}
.fix-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.fix-card{position:relative;display:grid;gap:10px;align-content:start;text-align:left;background:var(--sheet);border:var(--line);border-radius:6px;box-shadow:5px 5px 0 var(--ink);
  padding:30px 14px 14px;cursor:pointer;min-width:0;transition:transform .15s,box-shadow .15s}
.fix-card:hover:not([disabled]){transform:translate(-2px,-3px) rotate(-.8deg);box-shadow:8px 8px 0 var(--ink)}
.fix-card.deal{animation:deal .5s var(--d,0s) cubic-bezier(.3,1.4,.5,1) both}
.fix-card code{font-family:var(--mono);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.fix-letter{position:absolute;left:-3px;top:-3px;background:var(--ink);color:var(--yellow);font-family:var(--display);font-size:18px;padding:2px 10px;border-radius:6px 0 6px 0}
.fix-card .del{display:flex;align-items:center;gap:8px;font-weight:700}
.fix-card.wrong{background:var(--blush);cursor:default;box-shadow:3px 3px 0 var(--ink)}
.fix-card.wrong code{text-decoration:line-through 2px var(--red)}
.why{font-size:15px;font-weight:700;border-top:2px dashed var(--red);padding-top:8px;animation:rise .35s both}
.board-ev,.printout{padding:14px}
.col-side h3{font-family:var(--display);font-weight:400;letter-spacing:.06em;font-size:24px;margin:0 0 10px}
.notes{display:flex;flex-wrap:wrap;gap:12px;min-height:74px;align-content:flex-start}
.notes .empty{margin:0;font-size:15px;color:var(--ink-soft)}
.note{min-width:92px;max-width:100%;padding:6px 12px 9px;background:var(--nc,var(--yellow));border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(var(--r,0deg));display:grid}
.note.new{animation:noteIn .4s cubic-bezier(.3,1.6,.5,1) both}
.note.flip{animation:flip .5s ease}

<script>
(() => {

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const T = {
 en: {

  title: tx("The Backwards Billboard", "Die verkehrte Leuchtreklame"),
  who: tx("Ravi, sign maker", "Ravi, baut Schilder"),
  quote: tx("For the mirror sign we reverse the word. LOOP backwards must be POOL. The machine wrote POO. The mayor is not amused.", "Für das Spiegelschild drehen wir das Wort um. LOOP rückwärts muss POOL sein. Die Maschine schrieb POO. Der Bürgermeister ist nicht amüsiert."),
  culprit: tx("Zero Zoe", "Null-Nora"),
  lesson: tx("Counting down has to reach index 0. In Python range stops before its end, so the end must be -1. In Java and JavaScript use i >= 0.", "Rückwärts zählen muss bei Index 0 ankommen. In Python hört range vor dem Ende auf, also muss das Ende -1 sein. In Java und JavaScript nimm i >= 0."),
  card: tx("Paste, paste, paste.", "Einfügen, einfügen, einfügen."),
  hints: [tx("How many letters end up in rev? Which one is missing?", "Wie viele Buchstaben landen in rev? Welcher fehlt?"),
          tx("Positions start at 0. Does the loop ever reach i = 0?", "Positionen beginnen bei 0. Erreicht die Schleife jemals i = 0?")],
  want: ["POOL"], bugs: ["b1"],
  code: {
    py: [['word = "LOOP"', "w"], ['rev = ""', "r"], ["for i in range(len(word) - 1, 0, -1):", "b1"], ["    rev += word[i]", "add"], ["print(rev)", "out"]],
    java: [['String word = "LOOP";', "w"], ['String rev = "";', "r"], ["for (int i = word.length() - 1; i > 0; i--) {", "b1"], ["    rev += word.charAt(i);", "add"], "}", ["System.out.println(rev);", "out"]],
    js: [['const word = "LOOP";', "w"], ['let rev = "";', "r"], ["for (let i = word.length - 1; i > 0; i--) {", "b1"], ["  rev += word[i];", "add"], "}", ["console.log(rev);", "out"]]
  },
  fixes: { b1: [
    ok("for i in range(len(word) - 1, -1, -1):", "for (int i = word.length() - 1; i >= 0; i--) {", "for (let i = word.length - 1; i >= 0; i--) {"),
    no("for i in range(len(word), 0, -1):", "for (int i = word.length(); i > 0; i--) {", "for (let i = word.length; i > 0; i--) {", "Starts one place too far: there is no letter at position 4. Crash (JavaScript adds “undefined”).", "Beginnt eine Stelle zu weit: An Position 4 gibt es keinen Buchstaben. Absturz (JavaScript hängt „undefined“ an)."),
    no("for i in range(0, len(word)):", "for (int i = 0; i < word.length(); i++) {", "for (let i = 0; i < word.length; i++) {", "That walks forwards. You would get LOOP again, not POOL.", "Das läuft vorwärts. Heraus käme wieder LOOP, nicht POOL.")
  ] },
  sim(F) {
    const w = "LOOP", end = F.has("b1") ? 0 : 1, s = [P("w", { word: q(w) }), P("r", { rev: '""' })]; let rev = "";
    for (let i = 3; i >= end; i--) { s.push(P("b1", { i: String(i) })); rev += w[i]; s.push(P("add", { rev: q(rev) }, `+ "${w[i]}"`)); }
    s.push(P("b1", null, `${L(W.ends)}: i = ${end - 1}`), O("out", rev));
    return s;
  } },

{ id: "m3",
  title: tx("The Phantom Heatwave", "Die Phantom-Hitzewelle"),
  who: tx("Sven, polar researcher", "Sven, Polarforscher"),
  quote: tx("It was −5, −2 and −9 degrees this week. The report says the warmest day was 0 degrees. That day never happened!", "Diese Woche hatte es −5, −2 und −9 Grad. Der Bericht sagt, der wärmste Tag hatte 0 Grad. Den Tag gab es nie!"),
  culprit: tx("Start-Value Stan", "Startwert-Stefan"),
  lesson: tx("A starting value can win by accident. Start “the best so far” with the first real value, not with 0.", "Ein Startwert kann aus Versehen gewinnen. Starte „das Beste bisher“ mit dem ersten echten Wert, nicht mit 0."),
  card: tx("Meow.", "Miau."),
  hints: [tx("Does warmest ever change during the reconstruction?", "Ändert sich warmest beim Nachstellen überhaupt?"),
          tx("Every temperature is below 0. What does warmest start with?", "Jede Temperatur liegt unter 0. Womit startet warmest?")],
  want: ["-2"], bugs: ["b1"],
  code: {
    py: [["temps = [-5, -2, -9]", "tp"], ["warmest = 0", "b1"], ["for t in temps:", "lp"], ["    if t > warmest:", "if"], ["        warmest = t", "set"], ["print(warmest)", "out"]],
    java: [["int[] temps = {-5, -2, -9};", "tp"], ["int warmest = 0;", "b1"], ["for (int t : temps) {", "lp"], ["    if (t > warmest) {", "if"], ["        warmest = t;", "set"], "    }", "}", ["System.out.println(warmest);", "out"]],
    js: [["const temps = [-5, -2, -9];", "tp"], ["let warmest = 0;", "b1"], ["for (const t of temps) {", "lp"], ["  if (t > warmest) {", "if"], ["    warmest = t;", "set"], "  }", "}", ["console.log(warmest);", "out"]]
  },
  fixes: { b1: [
    ok("warmest = temps[0]", "int warmest = temps[0];", "let warmest = temps[0];"),
    no("warmest = -1", "int warmest = -1;", "let warmest = -1;", "-1 is still warmer than every temperature in the list. The answer would be −1.", "-1 ist immer noch wärmer als jede Temperatur in der Liste. Ergebnis wäre −1."),
    no("warmest = 100", "int warmest = 100;", "let warmest = 100;", "Nothing beats 100, so 100 would stay the “warmest” day.", "Nichts schlägt 100, also bliebe 100 der „wärmste“ Tag.")
  ] },
  sim(F, lang) {
    const tp = [-5, -2, -9]; let w = F.has("b1") ? -5 : 0;
    const s = [P("tp", { temps: arr(tp, lang) }), P("b1", { warmest: String(w) })];
    for (const t of tp) {
      s.push(P("lp", { t: String(t) }));
      const r = t > w; s.push(P("if", null, `${t} > ${w} → ${bool(r, lang)}`));
      if (r) { w = t; s.push(P("set", { warmest: String(w) })); }
    }
    s.push(O("out", w));
    return s;
  } },

  want: ["right left"], bugs: ["b1"],
  code: {

  fixes: { b1: [

{ id: "m5",
  title: tx("The Last Ice Cream", "Das letzte Eis"),
  who: tx("Lotta, ice cream fan", "Lotta, Eis-Fan"),
  quote: tx("I had 21 coins and each ice cream costs 7. The app sold me 2 and kept my last 7 coins. Exactly 7! That is a whole ice cream!", "Ich hatte 21 Münzen, und jedes Eis kostet 7. Die App hat mir 2 verkauft und meine letzten 7 Münzen behalten. Genau 7! Das ist ein ganzes Eis!"),
  culprit: tx("Almost Al", "Beinahe-Bea"),
  lesson: tx("While loops have borders too. “As long as I can afford it” means budget >= price, including the exact amount.", "Auch while-Schleifen haben Grenzen. „Solange ich es mir leisten kann“ heißt budget >= price, den genauen Betrag eingeschlossen."),
  card: tx("Copy. Paste. Escape.", "Kopieren. Einfügen. Abhauen."),
  hints: [tx("After two ice creams, how much money is left? Is it enough for one more?", "Wie viel Geld ist nach zwei Eis übrig? Reicht das für noch eins?"),
          tx("Check the while condition when budget and price are equal.", "Prüf die while-Bedingung, wenn budget und price gleich sind.")],
  want: ["3"], bugs: ["b1"],
  code: {
    py: [["budget = 21", "bu"], ["price = 7", "pr"], ["bought = 0", "bo"], ["while budget > price:", "b1"], ["    budget -= price", "sub"], ["    bought += 1", "inc"], ["print(bought)", "out"]],
    java: [["int budget = 21;", "bu"], ["int price = 7;", "pr"], ["int bought = 0;", "bo"], ["while (budget > price) {", "b1"], ["    budget -= price;", "sub"], ["    bought++;", "inc"], "}", ["System.out.println(bought);", "out"]],
    js: [["let budget = 21;", "bu"], ["const price = 7;", "pr"], ["let bought = 0;", "bo"], ["while (budget > price) {", "b1"], ["  budget -= price;", "sub"], ["  bought++;", "inc"], "}", ["console.log(bought);", "out"]]
  },
  fixes: { b1: [
    ok("while budget >= price:", "while (budget >= price) {", "while (budget >= price) {"),
    no("while budget > 0:", "while (budget > 0) {", "while (budget > 0) {", "Works for 21 by luck. With 20 coins it would buy a third ice cream for 6 and go into debt.", "Klappt bei 21 nur zufällig. Mit 20 Münzen würde es ein drittes Eis für 6 kaufen und Schulden machen."),
    no("while budget < price:", "while (budget < price) {", "while (budget < price) {", "This loop never even starts: 21 is not less than 7. Nothing gets bought.", "Diese Schleife startet gar nicht: 21 ist nicht kleiner als 7. Es wird nichts gekauft.")
  ] },
  sim(F, lang) {
    const op = F.has("b1") ? ">=" : ">", s = [P("bu", { budget: "21" }), P("pr", { price: "7" }), P("bo", { bought: "0" })]; let b = 21, n = 0;
    for (;;) {
      const c = op === ">=" ? b >= 7 : b > 7;
      s.push(P("b1", null, `${b} ${op} 7 → ${bool(c, lang)}`));
      if (!c) break;
      b -= 7; s.push(P("sub", { budget: String(b) })); n++; s.push(P("inc", { bought: String(n) }));
    }
    s.push(O("out", n));
    return s;
  } },

{ id: "m6",
  title: tx("The Open Vault", "Der offene Tresor"),
  who: tx("Bea, bank security", "Bea, Banksicherheit"),
  quote: tx("Our rule: at least 8 characters AND a digit. Somebody opened the vault with the password “abc1”. Four characters!", "Unsere Regel: mindestens 8 Zeichen UND eine Ziffer. Jemand hat den Tresor mit dem Passwort „abc1“ geöffnet. Vier Zeichen!"),
  culprit: tx("Either-Or Ed", "Entweder-Oder-Edi"),
  lesson: tx("“or” lets you in if ONE condition is true, “and” needs BOTH. Security rules almost always need “and”.", "„oder“ lässt dich rein, wenn EINE Bedingung stimmt, „und“ braucht BEIDE. Sicherheitsregeln brauchen fast immer „und“."),
  card: tx("You are slower than my scissors.", "Du bist langsamer als meine Schere."),
  hints: [tx("Look at the bubble next to the if: which values get combined?", "Schau auf die Sprechblase neben dem if: Welche Werte werden verknüpft?"),
          tx("The rule says AND. What does the code say?", "Die Regel sagt UND. Was sagt der Code?")],
  want: ["rejected"], bugs: ["b1"],
  code: {
    py: [['pw = "abc1"', "pw"], ["long_enough = len(pw) >= 8", "le"], ["has_digit = any(c.isdigit() for c in pw)", "hd"], ["if long_enough or has_digit:", "b1"], ['    print("accepted")', "acc"], "else:", ['    print("rejected")', "rej"]],
    java: [['String pw = "abc1";', "pw"], ["boolean longEnough = pw.length() >= 8;", "le"], ['boolean hasDigit = pw.matches(".*\\\\d.*");', "hd"], ["if (longEnough || hasDigit) {", "b1"], ['    System.out.println("accepted");', "acc"], "} else {", ['    System.out.println("rejected");', "rej"], "}"],
    js: [['const pw = "abc1";', "pw"], ["const longEnough = pw.length >= 8;", "le"], ["const hasDigit = /\\d/.test(pw);", "hd"], ["if (longEnough || hasDigit) {", "b1"], ['  console.log("accepted");', "acc"], "} else {", ['  console.log("rejected");', "rej"], "}"]
  },
  fixes: { b1: [
    ok("if long_enough and has_digit:", "if (longEnough && hasDigit) {", "if (longEnough && hasDigit) {"),
    no("if long_enough or not has_digit:", "if (longEnough || !hasDigit) {", "if (longEnough || !hasDigit) {", "Still “or”: one condition is enough to pass. Long passwords without digits get in.", "Immer noch „oder“: Eine Bedingung reicht. Lange Passwörter ohne Ziffer kommen rein."),
    no("if not long_enough and has_digit:", "if (!longEnough && hasDigit) {", "if (!longEnough && hasDigit) {", "Now only SHORT passwords with a digit pass. Exactly the wrong ones.", "Jetzt kommen nur KURZE Passwörter mit Ziffer durch. Genau die falschen.")
  ] },
  sim(F, lang) {
    const le = vn("long_enough", "longEnough", lang), hd = vn("has_digit", "hasDigit", lang), k = F.has("b1");
    const op = lang === "py" ? (k ? "and" : "or") : (k ? "&&" : "||"), r = !k;
    return [P("pw", { pw: q("abc1") }), P("le", { [le]: bool(false, lang) }, "4 >= 8"), P("hd", { [hd]: bool(true, lang) }),
      P("b1", null, `${bool(false, lang)} ${op} ${bool(true, lang)} → ${bool(r, lang)}`), O(r ? "acc" : "rej", r ? "accepted" : "rejected")];
  } },

{ id: "m7",
  title: tx("The Zero Dominoes", "Die Null-Dominos"),
  who: tx("Kai, domino artist", "Kai, baut Domino-Kunst"),
  quote: tx("How many ways can I line up 5 dominoes? Should be 5 × 4 × 3 × 2 × 1 = 120. The program insists: 0. Zero! Is my art worthless?!", "Auf wie viele Arten kann ich 5 Dominosteine aufreihen? Sollte 5 × 4 × 3 × 2 × 1 = 120 sein. Das Programm besteht auf 0. Null! Ist meine Kunst wertlos?!"),
  culprit: tx("Zero Zack", "Null-Nils"),
  lesson: tx("Anything times 0 is 0. Products start at 1, sums start at 0.", "Alles mal 0 ist 0. Produkte starten bei 1, Summen bei 0."),
  card: tx("Scratch… scratch…", "Kratz … kratz …"),
  hints: [tx("What is on the result sticky note after each round?", "Was steht nach jeder Runde auf dem Notizzettel result?"),
          tx("What do you get when you multiply 0 by anything?", "Was kommt raus, wenn du 0 mit irgendwas multiplizierst?")],
  want: ["120"], bugs: ["b1"],
  code: {
    py: [["n = 5", "n"], ["result = 0", "b1"], ["for i in range(1, n + 1):", "lp"], ["    result *= i", "mul"], ["print(result)", "out"]],
    java: [["int n = 5;", "n"], ["int result = 0;", "b1"], ["for (int i = 1; i <= n; i++) {", "lp"], ["    result *= i;", "mul"], "}", ["System.out.println(result);", "out"]],
    js: [["const n = 5;", "n"], ["let result = 0;", "b1"], ["for (let i = 1; i <= n; i++) {", "lp"], ["  result *= i;", "mul"], "}", ["console.log(result);", "out"]]
  },
  fixes: { b1: [
    ok("result = 1", "int result = 1;", "let result = 1;"),
    no("result = n", "int result = n;", "let result = n;", "Then 5 gets multiplied in twice: 5 × 1 × 2 × 3 × 4 × 5 = 600.", "Dann wird die 5 doppelt eingerechnet: 5 × 1 × 2 × 3 × 4 × 5 = 600."),
    no("result = 5 * 4 * 3 * 2", "int result = 5 * 4 * 3 * 2;", "let result = 5 * 4 * 3 * 2;", "Right number to start with, but the loop multiplies everything again: 120 × 120 = 14400.", "Richtiger Start, aber die Schleife multipliziert alles nochmal: 120 × 120 = 14400.")
  ] },
  sim(F) {
    let r = F.has("b1") ? 1 : 0; const s = [P("n", { n: "5" }), P("b1", { result: String(r) })];
    for (let i = 1; i <= 5; i++) { s.push(P("lp", { i: String(i) })); const o = r; r *= i; s.push(P("mul", { result: String(r) }, `${o} * ${i} = ${r}`)); }
    s.push(O("out", r));

{ id: "m8",
  title: tx("The Skipped Chapters", "Die übersprungenen Kapitel"),

          tx("Look at how much page grows each round.", "Schau, um wie viel page jede Runde wächst.")],
  want: ["1", "2", "3", "4", "5"], bugs: ["b1"],
  code: {

    java: [["int last = 5;", "l"], ["for (int page = 1; page <= last; page += 2) {", "b1"], ["    System.out.println(page);", "pr"], "}"],

{ id: "m9",
  title: tx("The Fruit That Was Not There", "Die Frucht, die nicht da war"),
  who: tx("Mo, fruit stand", "Mo, Obststand"),
  quote: tx("I just wanted to show the last fruit in the basket. The screen exploded with an error. My customers ran away.", "Ich wollte nur die letzte Frucht im Korb anzeigen. Der Bildschirm explodierte mit einer Fehlermeldung. Meine Kundschaft ist weggelaufen."),

  want: ["pear"], bugs: ["b1"],
  code: {

    java: [['String[] fruits = {"apple", "kiwi", "pear"};', "f"], ["String last = fruits[fruits.length];", "b1"], ["System.out.println(last);", "out"]],
    js: [['const fruits = ["apple", "kiwi", "pear"];', "f"], ["const last = fruits[fruits.length];", "b1"], ["console.log(last);", "out"]]

{ id: "m10", final: true,
  title: tx("The Copycat Garden", "Der Kopierkatzen-Garten"),

  quote: tx("My flower bed is 4 by 3 metres. The planner says 16 square metres and 16 metres of fence. Both wrong! And there are cat paw prints all over my keyboard.", "Mein Blumenbeet ist 4 mal 3 Meter. Der Planer sagt 16 Quadratmeter und 16 Meter Zaun. Beides falsch! Und auf meiner Tastatur sind überall Katzenpfoten."),
  culprit: tx("The Copycat", "Die Kopierkatze"),

      for (;;) { const y = a >= c; s.push(P("b2", null, `${a} >= ${c} → ${bool(y, lang)}`)); if (!y) break;
        a -= c; s.push(P("sub", { amount: String(a) })); n++; s.push(P("inc", { count: String(n) })); if (!F.has("b2")) break; } }
    s.push(O("o1", n), O("o2", a));
    return s;
  } },

{ id: "e4",
  title: tx("The Fake Primes", "Die falschen Primzahlen"),
  who: tx("Prof. Weiss, number museum", "Prof. Weiss, Zahlenmuseum"),
  quote: tx("Of 4, 6 and 7 only 7 is a prime. Our ancient prime detector found two primes, and neither of them was 7!", "Von 4, 6 und 7 ist nur 7 eine Primzahl. Unser uralter Primzahl-Detektor fand zwei Primzahlen, und keine davon war die 7!"),
  culprit: tx("Divider Dora", "Teiler-Theo"),
  lesson: tx("“d divides n” means the remainder is 0: n % d == 0. And to test a number you must try every possible divider, not stop halfway too early.", "„d teilt n“ heißt: Der Rest ist 0, also n % d == 0. Und zum Testen musst du jeden möglichen Teiler probieren, nicht zu früh aufhören."),
  card: tx("My comments are lies.", "Meine Kommentare lügen."),
  hints: [tx("Two bugs. Which dividers does the inner loop try for 4? And what remainder means “divides evenly”?", "Zwei Bugs. Welche Teiler probiert die innere Schleife bei 4? Und welcher Rest heißt „geht glatt auf“?")],
  want: ["1"], bugs: ["b1", "b2"],
  code: {
    py: [["nums = [4, 6, 7]", "n"], ["primes = 0", "p"], ["for n in nums:", "lp"], ["    is_prime = True", "ip"], ["    for d in range(2, n // 2):", "b1"], ["        if n % d == 1:", "b2"], ["            is_prime = False", "nf"], ["    if is_prime:", "if"], ["        primes += 1", "inc"], ["print(primes)", "out"]],
    java: [["int[] nums = {4, 6, 7};", "n"], ["int primes = 0;", "p"], ["for (int n : nums) {", "lp"], ["    boolean isPrime = true;", "ip"], ["    for (int d = 2; d < n / 2; d++) {", "b1"], ["        if (n % d == 1) {", "b2"], ["            isPrime = false;", "nf"], "        }", "    }", ["    if (isPrime) {", "if"], ["        primes++;", "inc"], "    }", "}", ["System.out.println(primes);", "out"]],
    js: [["const nums = [4, 6, 7];", "n"], ["let primes = 0;", "p"], ["for (const n of nums) {", "lp"], ["  let isPrime = true;", "ip"], ["  for (let d = 2; d < Math.floor(n / 2); d++) {", "b1"], ["    if (n % d === 1) {", "b2"], ["      isPrime = false;", "nf"], "    }", "  }", ["  if (isPrime) {", "if"], ["    primes++;", "inc"], "  }", "}", ["console.log(primes);", "out"]]
  },
  fixes: {
    b1: [
      ok("    for d in range(2, n):", "    for (int d = 2; d < n; d++) {", "  for (let d = 2; d < n; d++) {"),
      no("    for d in range(1, n):", "    for (int d = 1; d < n; d++) {", "  for (let d = 1; d < n; d++) {", "Every number can be divided by 1. Nothing would ever be a prime.", "Jede Zahl ist durch 1 teilbar. Dann wäre nie etwas eine Primzahl."),
      no("    for d in range(2, n + 1):", "    for (int d = 2; d <= n; d++) {", "  for (let d = 2; d <= n; d++) {", "Every number divides itself. 7 would be thrown out too.", "Jede Zahl ist durch sich selbst teilbar. Auch die 7 fiele raus.")
    ],
    b2: [
      ok("        if n % d == 0:", "        if (n % d == 0) {", "    if (n % d === 0) {"),
      no("        if n % d != 0:", "        if (n % d != 0) {", "    if (n % d !== 0) {", "That kicks numbers out when d does NOT divide them. Exactly the wrong way round.", "Das wirft Zahlen raus, wenn d sie NICHT teilt. Genau verkehrt herum."),
      no("        if n // d == 0:", "        if (n / d == 0) {", "    if (Math.floor(n / d) === 0) {", "That asks whether the division result is 0. For d smaller than n it never is.", "Das fragt, ob das Teilungsergebnis 0 ist. Für d kleiner als n ist es das nie.")
    ]
  },
  sim(F, lang) {
    const IP = vn("is_prime", "isPrime", lang), s = [P("n", { nums: arr([4, 6, 7], lang) }), P("p", { primes: "0" })]; let pr = 0;
    for (const n of [4, 6, 7]) {
      s.push(P("lp", { n: String(n) }), P("ip", { [IP]: bool(true, lang) })); let ip = true;
      const end = F.has("b1") ? n : Math.floor(n / 2), want = F.has("b2") ? 0 : 1;
      if (end <= 2) s.push(P("b1", null, `range(2, ${end}): ${L(tx("empty", "leer"))}`));
      for (let d = 2; d < end; d++) { s.push(P("b1", { d: String(d) })); const r = n % d; s.push(P("b2", null, `${n} % ${d} = ${r} → ${bool(r === want, lang)}`));
        if (r === want) { ip = false; s.push(P("nf", { [IP]: bool(false, lang) })); } }
      s.push(P("if", null, bool(ip, lang)));
      if (ip) { pr++; s.push(P("inc", { primes: String(pr) })); }
    }
    s.push(O("out", pr));
    return s;
  } },

      no("    p = prices[i] * 2", "    p = prices[i] * 2;", "  p = prices[i] * 2;", "Still writes into p, not into the list.", "Schreibt immer noch in p, nicht in die Liste.")
    ],

{ id: "e6",

  },

  [2500, "Mastermind Hunter", "Schrecken der Drahtzieher"], [3600, "Legend of Code City", "Legende von Code City"], [5000, "Bug Whisperer", "Bug-Orakel"]]
  .map(([at, en, de]) => ({ at, name: { en, de } }));
const MAXPTS = LEVELS.reduce((a, l) => a + l.base * 3 * l.cases.length, 0);
const LVOF = {}; LEVELS.forEach((l, li) => l.cases.forEach(c => { LVOF[c.id] = li; }));
const points = () => Object.entries(S.solved).reduce((a, [id, st]) => a + (LVOF[id] != null ? LEVELS[LVOF[id]].base * st : 0), 0);
const rankOf = p => { let r = 0; RANKS.forEach((k, i) => { if (p >= k.at) r = i; }); return r; };
const rankPct = p => { const r = rankOf(p), nx = RANKS[r + 1]; return nx ? Math.round((p - RANKS[r].at) / (nx.at - RANKS[r].at) * 100) : 100; };
const nextText = p => { const nx = RANKS[rankOf(p) + 1]; return nx ? tf("nextAt", { n: nx.at, r: L(nx.name) }) : t("maxRank"); };
const lvSolved = li => LEVELS[li].cases.filter(c => S.solved[c.id] != null).length;
const lvStars = li => LEVELS[li].cases.reduce((a, c) => a + (S.solved[c.id] || 0), 0);
const lvCaught = li => S.solved[LEVELS[li].cases[LEVELS[li].cases.length - 1].id] != null;
const bugRange = lv => { const n = lv.cases.map(c => c.bugs.length), a = Math.min(...n), b = Math.max(...n); return a === b ? String(a) : `${a}–${b}`; };
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const wantOf = c => typeof c.want === "function" ? c.want(S.code) : c.want;
const outsOf = steps => steps.filter(s => s.out != null && s.end !== "crash").map(s => s.out);
const lookOf = (li, i) => (li * 3 + i) % LOOKS.length;
const caseLabel = (lv, i) => lv.cases[i].final ? t("finale") : `${t("caseN")} ${i + 1}`;
const fileName = (lv, i) => { const n = lv.cases[i].final ? lv.villain.svg : lv.id + "_" + (i + 1); return S.code === "py" ? n + ".py" : S.code === "java" ? n[0].toUpperCase() + n.slice(1).replace(/_/g, "") + ".java" : n + ".js"; };
function actualText(c) {
  const st = c.sim(new Set(), S.code), o = outsOf(st), end = (st.find(s => s.end) || {}).end;
  return o.join(", ") + (end === "loop" ? `${o.length ? ", " : ""}… (${t("neverEnds")})` : end === "crash" ? `${o.length ? ", " : ""}💥 (${t("crashes")})` : "");
}
function rulesHTML(lv) {

    `<span>${ICON.timer} ${lv.time ? fmtTime(lv.time) + " " + t("perCase") : t("noTimer")}</span>`,

function codeLines(c, lang, fixed) {
  const out = [];
  for (const raw of c.code[lang]) {
    let [text, tag] = Array.isArray(raw) ? raw : [raw, ""], state = "";
    if (tag && c.bugs.includes(tag) && fixed.has(tag)) {
      const ok = c.fixes[tag].find(f => f.ok);
      if (ok.code === null) continue;
      text = text.match(/^\s*/)[0] + ok.code[lang].trimStart(); state = "fixed";
    }
    out.push({ text, tag, state });
  }
  return out;
}
function rebuildCode(justTag) {
  G.lines = codeLines(G.c, S.code, G.fixed);
  G.tagIdx = {};
  G.lines.forEach((l, i) => { if (l.tag && !(l.tag in G.tagIdx)) G.tagIdx[l.tag] = i; });
  const el = $("#lines");
  el.innerHTML = G.lines.map((l, i) => `<button class="ln ${l.state} ${justTag && l.tag === justTag && l.state ? "just" : ""}" type="button" data-act="line" data-i="${i}"><span class="no">${i + 1}</span><code>${hl(l.text, S.code) || " "}</code></button>`).join("");
  if (G.hint >= 2) markWarm();
  refreshLens();
}
function refreshLens() { const el = $("#lines"), li = $("#lens-in"); if (el && li) li.innerHTML = el.outerHTML.replace(' id="lines"', ""); }
function markWarm() { for (const b of G.c.bugs) if (!G.fixed.has(b) && G.tagIdx[b] != null) $("#lines").children[G.tagIdx[b]].classList.add("warm"); }

function setMode(m) {

  const b = $("#b-acc"); b.setAttribute("aria-pressed", String(m === "accuse")); b.classList.toggle("on", m === "accuse"); b.disabled = m === "fix";

  if (m !== "accuse") $("#lens").hidden = true;

}
function updatePlayBtn() { const b = $("#b-play"); if (b) b.innerHTML = G.playing ? `${ICON.pause}<span>${t("pause")}</span>` : `${ICON.play}<span>${t("reconstruct")}</span>`; }

/* trace playback */
function resetTrace() {
  if (!G) return;
  pause();
  G.steps = G.c.sim(G.fixed, S.code); G.si = -1; G.vars = {};
  const n = $("#notes"); if (n) n.innerHTML = `<p class="empty">${G.lv.hide ? t("hiddenVals") : t("noVars")}</p>`;
  const p = $("#paper"); if (p) p.innerHTML = "";
  const v = $("#verdict"); if (v) v.innerHTML = "";
  $("#marker")?.classList.remove("show");
  const c = $("#cond"); if (c) c.hidden = true;
  document.querySelectorAll(".ln.cur").forEach(e => e.classList.remove("cur"));
  $("#codep")?.classList.remove("siren");
}
function pause() { if (!G) return; G.playing = false; clearTimeout(G.tid); updatePlayBtn(); }
function play() {
  if (G.playing) { pause(); return; }
  if (G.si >= G.steps.length - 1) resetTrace();
  G.playing = true; updatePlayBtn(); loopTick();
}
function loopTick() {
  if (!G || !G.playing) return;
  if (!stepFwd()) { G.playing = false; updatePlayBtn(); onTraceEnd(); return; }
  G.tid = setTimeout(loopTick, 780 / (S.speed * (G.fast ? 2 : 1)));
}
function stepBtn() {
  pause();
  if (G.si >= G.steps.length - 1) resetTrace();
  stepFwd();
  if (G.si >= G.steps.length - 1) onTraceEnd();
}
function siren(word, sound) {
  const p = $("#codep"); p.classList.remove("siren"); void p.offsetWidth; p.classList.add("siren");
  const r = p.getBoundingClientRect(); burst(word, r.left + r.width / 2, r.top + 80, "red"); sfx(sound);
}
function stepFwd() {
  if (G.si >= G.steps.length - 1) return false;
  const st = G.steps[++G.si], lines = $("#lines");
  document.querySelectorAll(".ln.cur").forEach(e => e.classList.remove("cur"));
  const idx = G.tagIdx[st.t];
  if (idx != null) {
    const ln = lines.children[idx]; ln.classList.add("cur");
    const m = $("#marker"); m.classList.add("show");
    m.style.transform = `translateY(${lines.offsetTop + ln.offsetTop + (ln.offsetHeight - 28) / 2}px)`;
    showCond(G.lv.hide ? null : st.cond, ln);
    if (st.end === "crash") { ln.classList.add("boom"); setTimeout(() => ln.classList.remove("boom"), 1200); }
  }
  if (st.v) { Object.assign(G.vars, st.v); renderNotes(Object.keys(st.v)); }
  if (st.end === "crash") { printLine(st.out, "crash"); siren(t("crash"), "crash"); }
  else if (st.out != null) printLine(st.out);
  if (st.end === "loop") { printLine("… ∞", "more"); siren(t("loop"), "loop"); }

}
function showCond(text, ln) {
  const c = $("#cond");
  if (!text) { c.hidden = true; return; }
  const wrap = $("#cwrap"), code = ln.querySelector("code"), wr = wrap.getBoundingClientRect(), cr = code.getBoundingClientRect();
  c.hidden = false; c.textContent = text;
  c.style.left = (cr.right - wr.left + wrap.scrollLeft + 16) + "px";
  c.style.top = (cr.top - wr.top + wrap.scrollTop + cr.height / 2) + "px";
  c.style.animation = "none"; void c.offsetWidth; c.style.animation = "";
}
const NOTE_C = ["var(--yellow)", "var(--pink)", "var(--sky)"];
function renderNotes(changed) {
  const box = $("#notes"); box.querySelector(".empty")?.remove();
  Object.entries(G.vars).forEach(([k, v], i) => {
    let n = box.querySelector(`[data-k="${k}"]`), fresh = false;
    if (!n) {
      fresh = true; n = document.createElement("div"); n.className = "note new"; n.dataset.k = k;
      n.style.setProperty("--r", (((i * 37) % 7) - 3) + "deg"); n.style.setProperty("--nc", NOTE_C[i % 3]);
      n.innerHTML = `<span class="k">${esc(k)}</span><span class="v"></span>`; box.appendChild(n);
      setTimeout(() => n.classList.remove("new"), 450);
    }
    const ve = n.querySelector(".v"), shown = G.lv.hide ? "?" : v;
    if (n.dataset.v !== v) {
      n.dataset.v = v; ve.textContent = shown; ve.classList.toggle("txt", !G.lv.hide && v.startsWith('"')); ve.classList.toggle("hid", G.lv.hide);
      if (!fresh && changed.includes(k)) { n.classList.remove("flip"); void n.offsetWidth; n.classList.add("flip"); }
    }

}
function printLine(txt, cls) {
  const d = document.createElement("div"); d.className = "pl" + (cls ? " " + cls : "");
  $("#paper").appendChild(d); typeText(d, txt, cls === "crash" ? 12 : 40, true);
}
function onTraceEnd() {
  if (!G || G.closed) return;
  const end = (G.steps.find(s => s.end) || {}).end;
  const ok = !end && outsOf(G.steps).join("|") === wantOf(G.c).join("|");
  $("#verdict").innerHTML = ok ? `<span class="chip good">${ICON.check} ${t("match")}</span>` : `<span class="chip bad">${ICON.x} ${t("nomatch")}</span>`;
  if (ok && G.fixed.size === G.c.bugs.length) closeCase();
  else if (!ok && G.mode === "look") say(end === "loop" ? "duckLoop" : end === "crash" ? "duckCrash" : "duckAfterRun");
}

/* accusing */
function onLine(i, el) {
  if (!G || G.closed || G.mode === "fix") return;
  if (G.mode !== "accuse") { setMode("accuse"); say("duckMagnifier"); sfx("pop"); return; }
  const l = G.lines[i];
  if (l.tag && G.c.bugs.includes(l.tag) && !G.fixed.has(l.tag)) {
    pause();
    el.classList.add("guilty");
    const r = el.getBoundingClientRect();
    burst(t("gotcha"), r.left + Math.min(r.width / 2, 260), r.top - 10, "yellow"); sfx("gotcha");
    G.fixTag = l.tag; setMode("fix"); say("duckRight"); showFixes(true);
  } else {
    loseStar(); sfx("wrong");
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    alibi(el);
  }
}
function alibi(el) {
  document.querySelectorAll(".cond.alibi").forEach(a => a.remove());
  const wrap = $("#cwrap"), code = el.querySelector("code"), wr = wrap.getBoundingClientRect(), cr = code.getBoundingClientRect();
  const a = document.createElement("div"); a.className = "cond alibi";
  const list = t("alibis"); a.textContent = list[Math.random() * list.length | 0];
  a.style.left = (cr.right - wr.left + wrap.scrollLeft + 16) + "px";
  a.style.top = (cr.top - wr.top + wrap.scrollTop + cr.height / 2) + "px";
  wrap.appendChild(a); setTimeout(() => a.remove(), 1700);
}
function loseStar() {
  const box = $("#stars"); if (!box) return;
  if (G.stars > 1) {
    const on = box.querySelectorAll(".star.on"); on[on.length - 1].classList.add("lost");
    G.stars--; setTimeout(() => { if ($("#stars") && G) $("#stars").innerHTML = starsHTML(G.stars); }, 620);
  } else { box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
}
function showFixes(anim) {
  const tag = G.fixTag, fx = G.c.fixes[tag];
  const order = G.order[tag] || (G.order[tag] = shuffle(fx.map((f, i) => i)));
  const box = $("#fixes"); box.hidden = false;
  box.innerHTML = `<h3 class="h-display">${t("pickFix")}</h3><div class="fix-grid">${order.map((oi, k) => {
    const f = fx[oi], tried = G.tried.has(tag + oi);
    return `<button class="fix-card ${tried ? "wrong" : ""} ${anim ? "deal" : ""}" style="--d:${k * .1}s" data-act="fix" data-o="${oi}" ${tried ? "disabled" : ""}>
      <span class="fix-letter">${"ABC"[k]}</span>
      ${f.code === null ? `<span class="del">${ICON.trash} ${t("deleteLine")}</span>` : `<code>${hl(f.code[S.code].trimStart(), S.code)}</code>`}
      ${f.why ? `<span class="why" ${tried ? "" : "hidden"}>${esc(L(f.why))}</span>` : ""}
    </button>`; }).join("")}</div>`;
  if (anim) setTimeout(() => box.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" }), 120);
}
function onFix(oi, el) {
  if (!G || !G.fixTag) return;
  const tag = G.fixTag, f = G.c.fixes[tag][oi];
  if (!f.ok) {
    G.tried.add(tag + oi); el.classList.add("wrong"); el.disabled = true;
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    const w = el.querySelector(".why"); if (w) w.hidden = false;
    loseStar(); sfx("wrong"); say("duckWrongFix");
    return;
  }
  sfx("fix");
  const lnEl = $("#lines").children[G.tagIdx[tag]], r = lnEl.getBoundingClientRect();
  burst(t("zap"), r.left + Math.min(r.width / 2, 240), r.top - 10, "green");
  $("#fixes").hidden = true; G.fixTag = null; setMode("look");
  const go = () => {
    if (!G) return;
    G.fixed.add(tag); rebuildCode(tag); resetTrace();
    if (G.fixed.size < G.c.bugs.length) say("duckOneMore");
    else { say("duckFinal"); G.fast = true; setTimeout(() => G && !G.closed && play(), 750); }
  };
  if (f.code === null) { lnEl.classList.add("vanish"); setTimeout(go, 520); } else go();
  window.scrollTo({ top: Math.max(0, $("#codep").getBoundingClientRect().top + scrollY - 90), behavior: reduced ? "auto" : "smooth" });
}
function hint() {
  if (!G || G.closed || !G.hintsMax) return;
  if (G.hint >= G.hintsMax) { say("noMoreHints"); return; }
  const h = G.c.hints[G.hint++]; loseStar(); say(h); sfx("pop");
  if (G.hint >= 2) markWarm();
  const b = $('[data-act="hint"]'); if (b) b.innerHTML = `${t("hint")} (${G.hintsMax - G.hint}) <small>${t("cost")}</small>`;
}

/* magnifier lens */
const finePointer = matchMedia("(pointer: fine)").matches;
function lensMove(e) {
  if (!finePointer || !G || G.mode !== "accuse") return;
  const wrap = $("#cwrap"), lines = $("#lines"), lens = $("#lens"), inner = $("#lens-in");
  const wr = wrap.getBoundingClientRect(), lr = lines.getBoundingClientRect(), R = 85, s = 1.65;
  const lx = e.clientX - lr.left, ly = e.clientY - lr.top;
  lens.hidden = false;
  lens.style.left = (e.clientX - wr.left + wrap.scrollLeft - R) + "px";
  lens.style.top = (e.clientY - wr.top + wrap.scrollTop - R) + "px";
  inner.style.width = lines.offsetWidth + "px";
  inner.style.transform = `translate(${R - lx * s}px, ${R - ly * s}px) scale(${s})`;
}

/* clock */
function startClock() {
  stopClock();
  G.clock = setInterval(() => {
    if (!G || G.closed) return;
    G.time--;
    if (G.time <= 10 && G.time > 0) sfx("tick");
    if (G.time <= 0) {
      G.time = 60; loseStar(); sfx("wrong"); say("timeUp");
      const d = $("#deadline"); if (d) { const r = d.getBoundingClientRect(); burst(t("timeBurst"), r.left + r.width / 2, r.bottom + 40, "red"); }
    }
    paintClock();
  }, 1000);
}
function stopClock() { if (G && G.clock) { clearInterval(G.clock); G.clock = null; } }
function paintClock() {
  if (!G || G.time == null) return;
  const el = $("#clock-t"); if (el) el.textContent = fmtTime(G.time);
  $("#deadline")?.classList.toggle("urgent", G.time <= 30);
}

/* closing */
function closeCase() {
  if (G.closed) return;
  G.closed = true; pause(); stopClock();
  const c = G.c, prev = S.solved[c.id], p0 = points();
  S.solved[c.id] = Math.max(prev || 0, G.stars);
  if (prev == null && !c.final) justRevealed = c.id;
  save();
  const g = G; g.p0 = p0; g.p1 = points(); g.prev = prev;
  setTimeout(() => {
    sfx("stamp"); setTimeout(() => sfx("win"), 250);
    document.body.classList.add("shake-screen"); setTimeout(() => document.body.classList.remove("shake-screen"), 500);
    confetti(); showClosed(g, true); renderTop();
  }, 650);
}
function gainHTML(g, anim) {
  const p = anim ? g.p0 : g.p1, r = rankOf(p);
  if (g.p1 === g.p0) return `<div class="gain none"><span class="small">${tf("noGain", { n: g.prev })}</span></div>`;
  return `<div class="gain"><div class="gain-n" id="gain-n">+${anim ? 0 : g.p1 - g.p0}</div>
    <div class="gain-r"><span id="gain-badge">${badgeSVG(r)}</span><div class="gain-b"><div class="rk-name" id="gain-name">${esc(L(RANKS[r].name))}</div>
      <div class="bar"><i id="gain-bar" style="width:${rankPct(p)}%"></i></div><div class="small" id="gain-txt">${p} ${t("pts")} · ${esc(nextText(p))}</div></div></div>
    <div class="rankup" id="rankup" ${!anim && rankOf(g.p0) < rankOf(g.p1) ? "" : "hidden"}>${t("rankUp")}</div></div>`;
}
function animateGain(g) {
  const nEl = $("#gain-n"); if (!nEl) return;
  const r0 = rankOf(g.p0), r1 = rankOf(g.p1), dur = reduced ? 0 : 1100, t0 = performance.now(); let lastR = r0;
  const tick = now => {
    if (!$("#gain-n")) return;
    const k = dur ? Math.min(1, (now - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3), p = Math.round(g.p0 + (g.p1 - g.p0) * e), r = rankOf(p);
    $("#gain-n").textContent = "+" + (p - g.p0);
    $("#gain-bar").style.width = rankPct(p) + "%";
    $("#gain-txt").textContent = `${p} ${t("pts")} · ${nextText(p)}`;
    if (r !== lastR) { lastR = r; $("#gain-badge").innerHTML = badgeSVG(r, "pop"); $("#gain-name").textContent = L(RANKS[r].name); }
    if (k < 1) { if (Math.random() < .35) sfx("type"); requestAnimationFrame(tick); }
    else if (r1 > r0) { const ru = $("#rankup"); if (ru) { ru.hidden = false; sfx("rankup"); confetti(); } }
  };
  setTimeout(() => requestAnimationFrame(tick), 700);
}
function showClosed(g, anim) {
  ovFn = () => showClosed(g, false);
  const { c, i, lv } = g;
  overlay(`<div class="closed panel" role="dialog" aria-modal="true" aria-label="${t("closed")}" style="--lc:${lv.color}">
    <div class="stamp">${t("closed")}</div>
    <div class="earned">${starsHTML(g.stars)}</div>
    ${gainHTML(g, anim)}
    <div class="mug">
      <div class="mug-frame ${c.final ? "vil-frame" : ""}">${c.final ? villainSVG(lv) : bugSVG(i % 6)}<div class="mug-plate">${esc(L(c.culprit))}</div></div>
      <div><div class="lbl">${t("culprit")}</div><div class="mug-name">${esc(L(c.culprit))}</div><div class="lbl">${t("lesson")}</div><p>${esc(L(c.lesson))}</p></div>
    </div>
    ${c.card ? `<div class="scrap"><div class="lbl">${t("foundCard")}</div><div class="scrap-paper">“${esc(L(c.card))}”</div></div>` : ""}
    <div class="intro-actions">
      ${c.final ? `<button class="btn big" data-act="lvlend">${t("seeEnding")}</button>`
        : `<button class="btn ghost" data-act="board">${t("files")}</button><button class="btn big" data-act="next" data-i="${i + 1}">${t("next")} →</button>`}
    </div>
  </div>`);
  if (anim) animateGain(g);
}

/* level end + grand finale */
function renderLvlEnd() {
  const lv = LEVELS[LV], last = LV === LEVELS.length - 1, all = LEVELS.every((l, i) => lvCaught(i)), p = points(), r = rankOf(p);
  app.innerHTML = `<section class="end" style="--lc:${lv.color}">
    <div class="end-hero panel"><div class="rays" aria-hidden="true"></div><div class="end-in">
      <div class="end-clock">${villainSVG(lv)}<div class="bars" aria-hidden="true"></div></div>
      <h1 class="logo small">${esc(tf("behindBars", { v: L(lv.villain.name) }))}</h1>
      <p>${esc(L(lv.villain.end))}</p>
      ${all ? `<p>${t("end1")}</p><p>${t("end2")}</p>` : ""}
      <div class="rank">${badgeSVG(r)}<div><span class="lbl" style="color:#fff">${t("yourRank")}</span><strong>${esc(L(RANKS[r].name))}</strong><span>${p} / ${MAXPTS} ${t("pts")}</span></div></div>
    </div></div>
    <div class="panel arrested-list"><h2 class="h-display">${t("bugsArrested")}</h2>
      <ul>${lv.cases.map((c, i) => `<li>${c.final ? villainSVG(lv) : bugSVG(i % 6)}<div><strong>${esc(L(c.culprit))}</strong><p>${esc(L(c.lesson))}</p></div></li>`).join("")}</ul></div>
    <div class="intro-actions">${all ? `<button class="btn ghost" data-act="reset-all">${t("playAgain")}</button>` : ""}<button class="btn ghost" data-act="levels">${t("levels")}</button>${last ? "" : `<button class="btn" data-act="level" data-i="${LV + 1}">${t("nextLevel")} →</button>`}</div>
  </section>`;
}

/* ---------- events ---------- */
function rerender() {
  if (G) pause();
  render();
  if (ovFn) ovFn();
}
const go = s => { leaveScene(); closeOverlay(); screen = s; render(); window.scrollTo(0, 0); };
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i;
  switch (a) {
    case "home": go("title"); break;
    case "start": case "levels": go("levels"); break;
    case "level": LV = i; go("board"); if (!lvSolved(LV)) openIntro(0); break;
    case "board": go("board"); break;
    case "open": openIntro(i); break;
    case "close-ov": closeOverlay(); break;
    case "ladder": openLadder(); break;
    case "enter": startCase(i); break;
    case "next": go("board"); openIntro(i); break;
    case "lvlend": go("lvlend"); confetti(); sfx("win"); break;
    case "ui": S.ui = b.dataset.v; save(); rerender(); break;
    case "code": S.code = b.dataset.v; save(); rerender(); break;
    case "sound": S.sound = !S.sound; save(); renderTop(); sfx("pop"); break;
    case "speed": S.speed = S.speed >= 3 ? 1 : S.speed + 1; save(); b.querySelector("span").textContent = S.speed + "×"; sfx("pop");
      if (G && G.playing) { clearTimeout(G.tid); loopTick(); } break;
    case "play": play(); break;
    case "step": stepBtn(); break;
    case "rewind": resetTrace(); break;
    case "accuse": if (G.mode === "fix") break; setMode(G.mode === "accuse" ? "look" : "accuse"); if (G.mode === "accuse") { say("duckMagnifier"); sfx("pop"); } break;
    case "line": onLine(i, b); break;
    case "fix": onFix(+b.dataset.o, b); break;
    case "hint": hint(); break;
    case "reset-all":
      if (b.dataset.armed) { S.solved = {}; save(); go("title"); }
      else { b.dataset.armed = "1"; b.textContent = t("sure"); }
      break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const o = $(".overlay");
  if (o && !o.querySelector(".closed")) closeOverlay();
  else if (G && G.mode === "accuse") setMode("look");
});

render();

})();
</script>
